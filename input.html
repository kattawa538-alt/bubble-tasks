<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      font-family: -apple-system, "Segoe UI", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
    }
    .panel {
      margin: 8px;
      padding: 14px;
      background: rgba(20, 22, 35, 0.96);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
    }
    input[type="text"]::placeholder { color: rgba(255,255,255,0.5); }

    /* 締切日の入力 */
    .due-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      color: rgba(255,255,255,0.85);
      font-size: 13px;
    }
    input[type="date"] {
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
    }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; cursor: pointer; }

    /* 属性トグル（重要・緊急・すぐ終わる・今日やりたい）*/
    .flag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .flag-btn {
      flex: 1 1 46%;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 9px;
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.7);
      padding: 7px 2px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      line-height: 1;
    }
    .flag-btn.on { background: rgba(100,160,255,0.35); border-color: #7fd0ff; color: #fff; }
    .flag-btn .pic { fill: currentColor; }   /* 文字色に合わせる（OFF=薄灰／ON=白）*/

    /* 完了一覧を開くボタン */
    .completed-btn {
      width: 100%;
      margin-top: 12px;
      border: none;
      cursor: pointer;
      background: rgba(100,160,255,0.22);
      color: #cfe4ff;
      padding: 9px;
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
    }
    .completed-btn:hover { background: rgba(100,160,255,0.38); color: #fff; }

    /* 設定エリア */
    .settings {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.85);
      font-size: 13px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-row input[type="range"] { width: 150px; }
    .setting-row input[type="checkbox"] { width: 16px; height: 16px; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
    }
    .quit { cursor: pointer; }
    .quit:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="panel">
    <input id="taskInput" type="text" placeholder="タスクを入力して Enter…" />

    <div class="due-row">
      <span>締切（任意）</span>
      <input type="date" id="taskDue" />
    </div>

    <div class="flag-row">
      <button class="flag-btn" type="button" data-flag="important"></button>
      <button class="flag-btn" type="button" data-flag="urgent"></button>
      <button class="flag-btn" type="button" data-flag="quick"></button>
      <button class="flag-btn" type="button" data-flag="wish"></button>
    </div>

    <button class="completed-btn" id="showCompleted">完了したタスクを見る 📋</button>

    <div class="settings">
      <div class="setting-row">
        <span>ふわふわ揺らす</span>
        <input type="checkbox" id="floatChk" />
      </div>
      <div class="setting-row">
        <span>大きさ</span>
        <input type="range" id="sizeRange" min="120" max="260" step="10" value="180" />
      </div>
    </div>

    <div class="footer">
      <span>Enter で追加 / Esc で閉じる</span>
      <span class="quit" id="quit">終了</span>
    </div>
  </div>

  <script>
    const input = document.getElementById('taskInput');
    const dueInput = document.getElementById('taskDue');
    const floatChk = document.getElementById('floatChk');
    const sizeRange = document.getElementById('sizeRange');
    input.focus();

    // --- 属性アイコン（シルエット。index.html と同じ絵柄）---
    const ICON_PATHS = {
      important: 'M12 2l2.9 6.2 6.8.6-5.1 4.5 1.5 6.7L12 17l-6 3.5 1.5-6.7L2.4 8.8l6.8-.6z',
      urgent: 'M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6.2 6.3v4.7h2V7.6l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z',
      quick: 'M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z',
      wish: 'M15 3L16.35 7.14L20.71 7.15L17.19 9.71L18.53 13.85L15 11.3L11.47 13.85L12.81 9.71L9.29 7.15L13.65 7.14ZM12 9L14 11L5 20L3 19ZM9.5 8L10.8 9.3L6 15L4.8 14Z',
    };
    const FLAG_LABELS = { important: '重要', urgent: '緊急', quick: 'すぐ終わる', wish: '今日やりたい' };
    function iconSVG(name, size) {
      return `<svg class="pic" viewBox="0 0 24 24" width="${size}" height="${size}"><path d="${ICON_PATHS[name]}"/></svg>`;
    }

    // --- 属性トグルの状態と表示 ---
    const flags = { important: false, urgent: false, quick: false, wish: false };
    const flagBtns = document.querySelectorAll('.flag-btn');
    flagBtns.forEach(btn => {
      const k = btn.dataset.flag;
      btn.innerHTML = `${iconSVG(k, 18)}<span>${FLAG_LABELS[k]}</span>`;
      btn.addEventListener('click', () => {
        flags[k] = !flags[k];
        btn.classList.toggle('on', flags[k]);
      });
    });
    function resetFlags() {
      flags.important = flags.urgent = flags.quick = flags.wish = false;
      flagBtns.forEach(b => b.classList.remove('on'));
    }

    // 保存済みの設定を読み込み、コントロールに反映する。
    const settings = JSON.parse(localStorage.getItem('settings') || 'null') || { size: 180, float: true };
    floatChk.checked = settings.float;
    sizeRange.value = settings.size;

    function saveSettings() {
      localStorage.setItem('settings', JSON.stringify(settings));
    }

    // --- タスク追加（テキスト＋締切日＋属性）---
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) {
        const text = input.value.trim();
        const due = dueInput.value || null;
        if (text) window.bubbleAPI.addTask(text, due, flags);
        input.value = '';
        dueInput.value = '';
        resetFlags();
      } else if (e.key === 'Escape') {
        window.bubbleAPI.hideInput();
      }
    });

    // --- 完了したタスク一覧を開く ---
    document.getElementById('showCompleted').addEventListener('click', () => {
      window.bubbleAPI.openCompleted();
    });

    // --- 揺れ ON/OFF ---
    floatChk.addEventListener('change', () => {
      settings.float = floatChk.checked;
      saveSettings();
      window.bubbleAPI.setFloat(settings.float);
    });

    // --- 大きさ変更（スライダーを動かすたびに反映）---
    sizeRange.addEventListener('input', () => {
      settings.size = Number(sizeRange.value);
      saveSettings();
      window.bubbleAPI.setSize(settings.size);
    });

    document.getElementById('quit').addEventListener('click', () => {
      window.bubbleAPI.quit();
    });

    // 小窓が表示されるたびに、入力欄を空にしてフォーカス。
    window.addEventListener('focus', () => {
      input.value = '';
      dueInput.value = '';
      resetFlags();
      input.focus();
    });
  </script>
</body>
</html>
